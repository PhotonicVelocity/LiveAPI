# Hand-curated overrides for stub generation, applied after parse_apicapture_results.py
# produces LiveTree.parsed.json. Per doc/decisions.md ("Stub Accuracy and Pipeline Posture"),
# refinements are *only* used to correct known wrongness — not to make stubs prettier.
# Every entry below MUST include a `source` field documenting why the override is justified.
#
# ─────────────────────────────────────────────────────────────────────────────
# Schema (per dotted path):
#
#   "<dotted path>":
#     args:        { argN: real_name }              # rename positional args (key=from, value=to)
#     arg_types:   { name: <type-spec>, ... }       # override an arg's type by name
#     return_type: <type-spec>                      # override the return type
#     probed_type: <type-spec>                      # override property's probed type
#     source:      "<rationale citation>"           # required
#     _note:       "<optional free-text>"
#
# <type-spec> can be either:
#   - A bare scalar:    "Chain | None"
#   - A {from, to} dict for diff visibility:
#       from: NoneType
#       to:   "Chain | None"
#
# When `from` is provided, the applier validates it against the parsed-tree value
# and warns on mismatch — early-warning system for drift across Live versions.
#
# ─────────────────────────────────────────────────────────────────────────────

_meta:
  format_version: 1
  applies_to_version: "12.x"

# ─── Nullable-reference properties (probe observed None at probe time) ────────
#
# These properties are conceptually `T | None` but the probe happened to observe
# None on the test instance (e.g. no chain was selected when probing
# Song.View.selected_chain). The generator now emits `Any` for all NoneType-probed
# properties (see generate_stubs.py _resolve_probed_type); these refinements
# narrow `Any` to the specific `T | None` for the cases where T is known.
#
# Source for all 8: docstring describes the property as a nullable reference; type
# inferred from the property name and Live API conventions; the corpus audit also
# confirms the underlying type via assignments / reads in shipped Remote Scripts.

"Live.Browser.Browser.hotswap_target":
  probed_type:
    from: NoneType
    to: "Device | None"
  source: |
    Probed against Live 12.3.5 (MS33 in the curated baseline at doc/live-api/Browser.md):
    "During active hotswap, hotswap_target returns the Device object being swapped, not a
    BrowserItem." The stub's earlier BrowserItem annotation was incorrect — though the C++
    signature for relation_to_hotswap_target takes NPythonBrowser::TPythonBrowserItem and
    originally suggested otherwise. None when no hotswap is active. Settable: assigning a
    Device handle activates hotswap; assigning None deactivates.
  _note: |
    Push2/browser_component.py:538 still trips pyright because Push2 does
    `self._browser.hotswap_target.selected_preset_index = ...` — selected_preset_index is
    on PluginDevice, not the base Device. Push2 narrows via runtime context that pyright
    can't see; that's Push2's concern, not the stub's. After this fix the audit finding
    becomes part of the deferred / declined bucket, not a stub bug.

"Live.Clip.Clip.groove":
