# ──────────────────────────────────────────────────────────────────────────────
# Arg-name renames — corpus / M4L / docstring evidence per arg
#
# Each entry's `source:` field cites concrete evidence per renamed arg, with a
# bracket-label indicating evidence strength:
#   [callsite, N/M defs]      — Ableton's own Python wrappers in the decompiled
#                               Remote Scripts corpus define the method with
#                               this parameter name (N of M def-statements
#                               agree); cite the first def-site
#   [callsite, N/M call sites] — call-site keyword-arg use in the corpus
#   [M4L docs]                — the parameter name appears in the Max for Live
#                               docs for the class
#   [docstring]               — name inferred from the function's docstring
#                               (description of what the arg means)
#   [C++ signature]           — name inferred from C++ binding signature
#                               (TString, etc.) — weak evidence
#   [inferred]                — pure structural inference from method name /
#                               sister method symmetry / parameter type;
#                               watch for drift
#
# Names are decorative — `, /` makes every callable positional-only at the
# type-checker level, so the worst case for a wrong name is autocomplete
# inaccuracy, not a kwarg-call failure. Confidence flags are omitted from this
# section to keep it skimmable; the bracket labels carry the per-arg signal.
# Entries where confidence deserves explicit emphasis (e.g. when a type is
# also being refined) carry a `confidence:` field.
# ──────────────────────────────────────────────────────────────────────────────

