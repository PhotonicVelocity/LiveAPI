"Live.Clip.Clip.quantize_pitch":
  args:
    arg2: note
    arg3: quantization_grid
    arg4: amount
  arg_types:
    quantization_grid:
      from: int
      to: "GridQuantization | int"
  confidence: high
  source: |
    arg2 rename — callsite, 6/7 defs use 'note' across drum_group_component
    wrappers (drum_group_component.py:88, _Framework/DrumGroupComponent.py:331,
    etc.). M4L/baseline use `pitch` instead — the corpus def-vote dominates
    here, but if drift surfaces, `pitch` is the documented form.
    arg3 rename — the previous `source` rename was WRONG. The single def-vote
    came from pushbase/quantization_component.py:125 `def quantize_pitch(self,
    note, source=None)`, but that is a wrapper whose `source` is a UI tag
    string (e.g. "slice", "pad") used only in show_notification at line 129;
    the wrapper does NOT pass `source` to the binding. The actual direct
    binding call at line 128 passes `self.settings.quantize_to` as arg3 — a
    GridQuantization enum int. M4L docs (clip.md) names arg3 `quantization_grid`.
    arg3 type — C++ signature is `void quantize_pitch(TPyHandle<AClip>, int,
    int, float)` — int. The probed runtime accepts `GridQuantization` enum
    values 1–8 (0 and 9 raise `Invalid quantization`); narrowed to
    `GridQuantization | int` matching the sister `Clip.View.grid_quantization`
    and `Clip.quantize`.
    arg4 -> amount [M4L docs]: external/max-for-live-docs/9.0/clip.md names it
    'amount'; sister method `quantize(quantization_grid, amount)` confirms.

