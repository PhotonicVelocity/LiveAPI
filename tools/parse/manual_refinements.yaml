# ─── Feedback-rule parameters: missing nullability ────────────────────────────
#
# The feedback-rule parameter on the three with_feedback_map MIDI mapping
# functions is documented as required, but Ableton's own _Framework/ControlSurface.py
# (and ableton/v2/control_surface/control_surface.py) passes None at runtime for
# all three. The Boost.Python binding accepts None; our stub claiming a non-None
# parameter type is strictly narrower than the runtime.

"Live.MidiMap.map_midi_cc_with_feedback_map":
  arg_types:
    feedback_rule:
      from: CCFeedbackRule
      to: "CCFeedbackRule | None"
  source: |
    Audit found None passed at _Framework/ControlSurface.py:488 and
    ableton/v2/control_surface/control_surface.py:438 — Ableton's official base
    classes pass None when no feedback rule applies.

# Note: map_midi_note_with_feedback_map and map_midi_pitchbend_with_feedback_map
# combine arg-name renames (imported below) with the feedback-rule type widening
# documented above. They live as single consolidated entries here rather than
# duplicate entries in the import block — duplicate top-level keys would otherwise
# cause silent override (PyYAML's "last wins" behavior).

"Live.MidiMap.map_midi_note_with_feedback_map":
  args:
    arg1: midi_map_handle
    arg2: device_parameter
    arg3: midi_channel
    arg4: note
    arg5: feedback_rule
  arg_types:
    feedback_rule:
      from: NoteFeedbackRule
      to: "NoteFeedbackRule | None"
  source: |
    Arg renames imported from refinements.llm.json (callsite-cited):
      - arg1 -> midi_map_handle, arg2 -> device_parameter, arg3 -> midi_channel,
        arg4 -> note, arg5 -> feedback_rule  (consistent with the rest of the
        MidiMap family; original sources cite call-site naming).
    feedback_rule type widened to None: audit found None passed at
    _Framework/ControlSurface.py:485 and ableton/v2/control_surface/control_surface.py:435.

"Live.MidiMap.map_midi_pitchbend_with_feedback_map":
  args:
    arg1: midi_map_handle
    arg2: device_parameter
    arg3: midi_channel
    arg4: feedback_rule
    arg5: needs_takeover
  arg_types:
    feedback_rule:
      from: PitchBendFeedbackRule
      to: "PitchBendFeedbackRule | None"
  source: |
    Arg renames imported from refinements.llm.json (structural / consistency):
      - arg1 -> midi_map_handle, arg2 -> device_parameter, arg3 -> midi_channel,
        arg4 -> feedback_rule, arg5 -> needs_takeover.
    feedback_rule type widened to None: audit found None passed at
    _Framework/ControlSurface.py:491 and ableton/v2/control_surface/control_surface.py:441.

