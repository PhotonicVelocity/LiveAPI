# ─── Feedback-rule parameter renames (type-widening REJECTED) ────────────────
#
# The three with_feedback_map functions had a `T -> T | None` widening on
# feedback_rule based on an audit that read `feedback_rule = None` at the top of
# `_install_mapping` in `_Framework/ControlSurface.py` and the v2 equivalent as
# "None passed at runtime." On re-read, the variable is reassigned to a concrete
# *FeedbackRule in all reachable paths before any dispatch call, and no corpus
# call site (across all 11 files using these functions) passes a literal None.
# Widening removed; map_midi_cc_with_feedback_map has no other refinement and
# was dropped entirely. The note + pitchbend entries below keep arg-name renames
# only. Probe later if nullability is wanted — see refinements_followup.md.

"Live.MidiMap.map_midi_note_with_feedback_map":
  args:
    arg1: midi_map_handle
    arg2: device_parameter
    arg3: midi_channel
    arg4: note
    arg5: feedback_rule
  source: |
    Arg renames verified against corpus call sites — all three sites pass the
    same positional shape `(midi_map_handle, parameter, channel, identifier,
    feedback_rule)`:
      - _Framework/ControlSurface.py:485
      - ableton/v2/control_surface/control_surface.py:435
      - Axiom_AIR_25_49_61/Axiom_AIR_25_49_61.py:608
    Per-arg mapping:
      - arg1 -> midi_map_handle  [callsite]: variable named `midi_map_handle`
      - arg2 -> device_parameter [callsite, type-qualified]: callsite uses bare
        `parameter`; qualified to `device_parameter` for stub readability since
        the type is DeviceParameter
      - arg3 -> midi_channel     [callsite, semantic]: callsite passes
        `control.message_channel()` — semantic name
      - arg4 -> note             [callsite, semantic]: callsite passes
        `control.message_identifier()` which in note context is a MIDI note number
      - arg5 -> feedback_rule    [callsite]: variable named `feedback_rule`

"Live.MidiMap.map_midi_pitchbend_with_feedback_map":
  args:
    arg1: midi_map_handle
    arg2: device_parameter
    arg3: midi_channel
    arg4: feedback_rule
    arg5: needs_takeover
  source: |
    Arg renames verified against corpus call sites — all sites pass the same
    positional shape `(midi_map_handle, parameter, channel, feedback_rule,
    not needs_takeover)`:
      - _Framework/ControlSurface.py:491
      - ableton/v2/control_surface/control_surface.py:441
      - Axiom_AIR_25_49_61/Axiom_AIR_25_49_61.py:614
      - MackieControl/ChannelStrip.py:199, 379
      - MackieControl_Classic/ChannelStrip.py:197, 377
    Per-arg mapping:
      - arg1 -> midi_map_handle  [callsite]: variable named `midi_map_handle`
      - arg2 -> device_parameter [callsite, type-qualified]: callsite uses
        `parameter` / `__fader_parameter`; qualified to `device_parameter`
      - arg3 -> midi_channel     [callsite, semantic]: callsite passes
        `control.message_channel()` (or `__strip_index`)
      - arg4 -> feedback_rule    [callsite]: variable named `feedback_rule`
        / `feeback_rule` [sic]
      - arg5 -> needs_takeover   [callsite, semantic]: callsite passes
        `not control.needs_takeover()` — the parameter controls takeover
        behavior; bool inverted by caller

