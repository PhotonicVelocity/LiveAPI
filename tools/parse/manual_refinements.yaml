#   - Entries citing [M4L docs] are MEDIUM (documentation).
#   - Entries citing [structural / other] are effectively LOW (inferred from method
#     name / sister method symmetry / parameter type). Watch for drift; widen or
#     correct if the audit surfaces a contradiction.
#   These are conventions, not per-entry annotations — adding 81 individual
#   confidence: tags would obscure rather than clarify. Specific high/low tags
#   are added to entries where the level deserves explicit emphasis.
