"Live.Application.ControlSurfaceProxy.release_control":
  args:
    arg2: control_id
  source: |
    arg2 rename — the binding takes the control's int ID. M4L docs
    (controlsurface.md) name the parameter `control` (matching the M4L
    abstraction where scripts pass a control object), but Live's binding is
    one layer below: it takes the int. Direct binding call at
    _MxDCore/ControlSurfaceWrapper.py:266 confirms:
    `self._proxy.release_control(control.id)` — passes `.id`, an int.
    Renamed to `control_id` for clarity (matches the type, avoids implying
    callers should pass a control object). Names are positional-only and
    decorative — clarity over doc-conformance.

"Live.Application.ControlSurfaceProxy.send_midi":
  args:
    arg2: midi_event_bytes
  arg_types:
    midi_event_bytes:
      from: tuple
      to: "tuple[int, ...]"
  confidence: high
  source: |
    arg2 rename — callsite, 10/20 defs use 'midi_event_bytes' across Python
    wrapper classes (FaderfoxComponent.py:41, FaderfoxScript.py:110,
    Axiom_49_61_Classic/Axiom.py:69, etc.).
    type — C++ signature in raw_doc: `void send_midi(APythonControlSurfaceProxy
    {lvalue}, boost::python::tuple)`. The binding takes an untyped tuple at the
    C++ level; narrowed to `tuple[int, ...]` based on function semantics (MIDI
    bytes are 0–255 ints by definition) and corpus evidence:
      - Direct binding calls pass int tuples: FaderfoxScript.py:111
        (`self.c_instance.send_midi(midi_event_bytes)`) and
        Axiom_49_61_Classic/Axiom.py:70
        (`self._Axiom__c_instance.send_midi(midi_event_bytes)`).
      - Wrapper composers also pass int tuples:
        LV2_LX2_LC2_LD2/LV2TransportController.py:69-71
        (`(NOTEON_STATUS + channel, note, 127)`),
        LV2_LX2_LC2_LD2/FaderfoxMixerController.py:142
        (`(175, 16, 16)`).

"Live.Application.ControlSurfaceProxy.send_value":
  args:
    arg2: value
  arg_types:
    value:
      from: tuple
      to: "tuple[Any, ...]"
  confidence: high
  source: |
    arg2 rename — callsite, 16/19 defs use 'value' across Python wrapper classes
    (_Framework/InputControlElement.py:324, ableton/v2/control_surface/elements/
    button.py:102, etc.).
    type — C++ signature in raw_doc explicitly: `void send_value(
    APythonControlSurfaceProxy {lvalue}, boost::python::tuple)`. The binding
    strictly accepts a tuple. `tuple[Any, ...]` matches the untyped Boost.Python
    tuple — the binding itself doesn't constrain element type at the C++ level.
    Corpus calls like `interface.send_value(0)` or `button.send_value(value)`
    don't contradict this — those go to Python wrappers (SysexElement.send_value
    at sysex_element.py:25, InputControlElement.send_value at
    InputControlElement.py:324) which compose a tuple internally before the
    binding call. Zero direct `Live.Application.ControlSurfaceProxy.send_value`
    call sites exist in the corpus.

