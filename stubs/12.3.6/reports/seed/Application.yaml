module: Application
primary_class:
- name: Application
  raw_doc: This class represents the Live application.
  properties:
  - name: average_process_usage
    listenable:
    - add_average_process_usage_listener
    - remove_average_process_usage_listener
    - average_process_usage_has_listener
  - name: browser
  - name: canonical_parent
  - name: control_surfaces
    listenable:
    - add_control_surfaces_listener
    - remove_control_surfaces_listener
    - control_surfaces_has_listener
  - name: current_dialog_button_count
  - name: current_dialog_message
  - name: number_of_push_apps_running
  - name: open_dialog_count
    listenable:
    - add_open_dialog_count_listener
    - remove_open_dialog_count_listener
    - open_dialog_count_has_listener
  - name: peak_process_usage
    listenable:
    - add_peak_process_usage_listener
    - remove_peak_process_usage_listener
    - peak_process_usage_has_listener
  - name: unavailable_features
    listenable:
    - add_unavailable_features_listener
    - remove_unavailable_features_listener
    - unavailable_features_has_listener
  - name: view
  methods:
  - name: get_bugfix_version
  - name: get_build_id
  - name: get_document
  - name: get_major_version
  - name: get_minor_version
  - name: get_variant
  - name: get_version_string
  - name: has_option
  - name: press_current_dialog_button
  - name: show_message
  - name: show_on_the_fly_message
  classes:
  - name: View
    raw_doc: This class represents the view aspects of the Live application.
    properties:
    - name: browse_mode
      listenable:
      - add_browse_mode_listener
      - remove_browse_mode_listener
      - browse_mode_has_listener
    - name: canonical_parent
    - name: focused_document_view
      listenable:
      - add_focused_document_view_listener
      - remove_focused_document_view_listener
      - focused_document_view_has_listener
    - name: is_view_visible
      listenable:
      - add_is_view_visible_listener
      - remove_is_view_visible_listener
      - is_view_visible_has_listener
    - name: view_focus_changed
      listenable:
      - add_view_focus_changed_listener
      - remove_view_focus_changed_listener
      - view_focus_changed_has_listener
    methods:
    - name: available_main_views
    - name: focus_view
    - name: hide_view
    - name: is_view_visible
    - name: scroll_view
    - name: show_view
    - name: toggle_browse
    - name: zoom_view
    enums:
    - name: NavDirection
classes:
- name: ControlDescription
  raw_doc: Describes a control present in a control surface proxy
  properties:
  - name: id
  - name: name
- name: ControlDescriptionVector
  raw_doc: A container for returning control descriptions.
  methods:
  - name: append
  - name: extend
- name: ControlSurfaceProxy
  raw_doc: Represents a control surface running in a different process. For use by M4L
  properties:
  - name: control_descriptions
  - name: pad_layout
    listenable:
    - add_pad_layout_listener
    - remove_pad_layout_listener
    - pad_layout_has_listener
  - name: type_name
  - name: control_values_arrived
    listenable:
    - add_control_values_arrived_listener
    - remove_control_values_arrived_listener
    - control_values_arrived_has_listener
  - name: midi_received
    listenable:
    - add_midi_received_listener
    - remove_midi_received_listener
    - midi_received_has_listener
  methods:
  - name: enable_receive_midi
  - name: fetch_received_midi_messages
  - name: fetch_received_values
  - name: grab_control
  - name: release_control
  - name: send_midi
  - name: send_value
  - name: subscribe_to_control
  - name: unsubscribe_from_control
- name: UnavailableFeatureVector
  raw_doc: A container for returning unavailable features.
  methods:
  - name: append
  - name: extend
- name: Variants
  raw_doc: Holds strings representing what type of Live is running.
  constants:
  - name: BETA
  - name: INTRO
  - name: LITE
  - name: STANDARD
  - name: SUITE
  - name: TRIAL
enums:
- name: MessageButtons
- name: PushDialogType
- name: UnavailableFeature
functions:
- name: combine_apcs
- name: encrypt_challenge
- name: encrypt_challenge2
- name: get_application
- name: get_random_int
