module: RackDevice
members:
- kind: class
  name: RackDevice
  raw_doc: This class represents a Rack device.
  ancestors:
  - Device
  - LomObject
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  members:
  - kind: class
    name: View
    raw_doc: Representing the view aspects of a rack device.
    ancestors:
    - View
    - LomObject
    init_doc: |-
      Raises an exception
      This class cannot be instantiated from Python
    members:
    - kind: property
      name: canonical_parent
      raw_doc: Get the canonical parent of the View.
      type: RackDevice
      repr: <class 'RackDevice.RackDevice'>
      settable: false
    - kind: property
      name: drum_pads_scroll_position
      raw_doc: Access to the index of the lowest visible row of pads. Throws an exception if can_have_drum_pads is false.
      type: int
      settable: true
      listenable:
      - add_drum_pads_scroll_position_listener
      - remove_drum_pads_scroll_position_listener
      - drum_pads_scroll_position_has_listener
    - kind: property
      name: is_collapsed
      raw_doc: Get/Set/Listen if the device is shown collapsed in the device chain.
      type: bool
      settable: true
    - kind: property
      name: is_showing_chain_devices
      raw_doc: Return whether the devices in the currently selected chain are visible. Throws an exception if can_have_chains is false.
      type: bool
      settable: true
      listenable:
      - add_is_showing_chain_devices_listener
      - remove_is_showing_chain_devices_listener
      - is_showing_chain_devices_has_listener
    - kind: property
      name: selected_chain
      raw_doc: Return access to the currently selected chain.
      type: Chain | None
      settable: true
      listenable:
      - add_selected_chain_listener
      - remove_selected_chain_listener
      - selected_chain_has_listener
    - kind: property
      name: selected_drum_pad
      raw_doc: Return access to the currently selected drum pad. Throws an exception if can_have_drum_pads is false.
      type: DrumPad
      repr: <class 'DrumPad.DrumPad'>
      settable: true
      listenable:
      - add_selected_drum_pad_listener
      - remove_selected_drum_pad_listener
      - selected_drum_pad_has_listener
  - kind: method
    name: add_macro
    raw_doc: Increases the number of visible macro controls in the rack. Throws an exception if the maximum number of macro controls is reached.
    signature: 'add_macro( (RackDevice)arg1) -> None :'
    cpp_signature: void add_macro(TRackDevicePyHandle)
    returns:
      type: None
  - kind: property
    name: can_compare_ab
    raw_doc: Returns true if the Device has the capability to AB compare.
    type: bool
    settable: false
  - kind: property
    name: can_have_chains
    raw_doc: Returns true if the device is a rack.
    type: bool
    settable: false
  - kind: property
    name: can_have_drum_pads
    raw_doc: Returns true if the device is a drum rack.
    type: bool
    settable: false
  - kind: property
    name: can_show_chains
    raw_doc: return True, if this Rack contains a rack instrument device that is capable of showing its chains in session view.
    type: bool
    settable: false
  - kind: property
    name: canonical_parent
    raw_doc: Get the canonical parent of the Device.
    type: Track
    repr: <class 'Track.Track'>
    settable: false
  - kind: property
    name: chain_selector
    raw_doc: Const access to the chain selector parameter.
    type: DeviceParameter
    repr: <class 'DeviceParameter.DeviceParameter'>
    settable: false
  - kind: property
    name: chains
    raw_doc: Return const access to the list of chains in this device. Throws an exception if can_have_chains is false.
    type: Vector
    repr: <class 'Base.Vector'>
    element_repr: <class 'Chain'>
    settable: false
    listenable:
    - add_chains_listener
    - remove_chains_listener
    - chains_has_listener
  - kind: property
    name: class_display_name
    raw_doc: Return const access to the name of the device's class name as displayed in Live's browser and device chain
    type: str
    settable: false
  - kind: property
    name: class_name
    raw_doc: Return const access to the name of the device's class.
    type: str
    settable: false
  - kind: method
    name: copy_pad
    raw_doc: Copies all contents of a drum pad from a source pad into a destination pad. copy_pad(source_index, destination_index) where source_index and destination_index correspond to the note number/index of the drum pad in a drum rack. Throws an exception when the source pad is empty, or when the source or destination indices are not between 0 - 127.
    signature: 'copy_pad( (RackDevice)arg1, (int)arg2, (int)arg3) -> None :'
    cpp_signature: void copy_pad(TRackDevicePyHandle,int,int)
    args:
    - name: source_index
      type: int
    - name: destination_index
      type: int
    returns:
      type: None
  - kind: method
    name: delete_selected_variation
    raw_doc: Deletes the currently selected macro variation.Does nothing if there is no selected variation.
    signature: 'delete_selected_variation( (Device)arg1) -> None :'
    cpp_signature: void delete_selected_variation(TPyHandle<ADevice>)
    returns:
      type: None
  - kind: property
    name: drum_pads
    raw_doc: Return const access to the list of drum pads in this device. Throws an exception if can_have_drum_pads is false.
    type: Vector
    repr: <class 'Base.Vector'>
    element_repr: <class 'DrumPad.DrumPad'>
    settable: false
    listenable:
    - add_drum_pads_listener
    - remove_drum_pads_listener
    - drum_pads_has_listener
  - kind: property
    name: has_drum_pads
    raw_doc: Returns true if the device is a drum rack which has drum pads. Throws an exception if can_have_drum_pads is false.
    type: bool
    settable: false
    listenable:
    - add_has_drum_pads_listener
    - remove_has_drum_pads_listener
    - has_drum_pads_has_listener
  - kind: property
    name: has_macro_mappings
    raw_doc: Returns true if any of the rack's macros are mapped to a parameter.
    type: bool
    settable: false
    listenable:
    - add_has_macro_mappings_listener
    - remove_has_macro_mappings_listener
    - has_macro_mappings_has_listener
  - kind: method
    name: insert_chain
    raw_doc: Inserts a new chain, either at the specified index or, if not index was specified, at the end of the chain sequence.
    signature: 'insert_chain( (RackDevice)arg1 [, (int)Index=-1]) -> LomObject :'
    cpp_signature: TWeakPtr<TPyHandleBase> insert_chain(TRackDevicePyHandle [,int=-1])
    args:
    - name: index
      type: int
      optional: true
      default: '-1'
    returns:
      type: Chain
  - kind: property
    name: is_active
    raw_doc: Return const access to whether this device is active. This will be false bothwhen the device is off and when it's inside a rack device which is off.
    type: bool
    settable: false
  - kind: property
    name: is_showing_chains
    raw_doc: Returns True, if it is showing chains.
    type: bool
    settable: true
    listenable:
    - add_is_showing_chains_listener
    - remove_is_showing_chains_listener
    - is_showing_chains_has_listener
  - kind: property
    name: is_using_compare_preset_b
    raw_doc: Returns whether the Device has loaded the preset in compare slot B. Only relevant if can_compare_ab, otherwise errors.
    type: bool
    settable: true
  - kind: property
    name: latency_in_ms
    raw_doc: Returns the latency of the device in ms.
    type: float
    settable: false
  - kind: property
    name: latency_in_samples
    raw_doc: Returns the latency of the device in samples.
    type: int
    settable: false
  - kind: property
    name: macros_mapped
    raw_doc: A list of booleans, one for each macro parameter, which is True iffthat macro is mapped to something
    type: tuple
    repr: <class 'tuple'>
    element_repr: <class 'bool'>
    settable: false
    listenable:
    - add_macros_mapped_listener
    - remove_macros_mapped_listener
    - macros_mapped_has_listener
  - kind: property
    name: name
    raw_doc: Return access to the name of the device.
    type: str
    settable: true
  - kind: property
    name: parameters
    raw_doc: Const access to the list of available automatable parameters for this device.
    type: ATimeableValueVector
    repr: <class 'Device.ATimeableValueVector'>
    element_repr: <class 'DeviceParameter.DeviceParameter'>
    settable: false
  - kind: method
    name: randomize_macros
    raw_doc: Randomizes the values for all macro controls not excluded from randomization.
    signature: 'randomize_macros( (RackDevice)arg1) -> None :'
    cpp_signature: void randomize_macros(TRackDevicePyHandle)
    returns:
      type: None
  - kind: method
    name: recall_last_used_variation
    raw_doc: Recalls the macro variation that was recalled most recently.Does nothing if no variation has been recalled yet.
    signature: 'recall_last_used_variation( (Device)arg1) -> None :'
    cpp_signature: void recall_last_used_variation(TPyHandle<ADevice>)
    returns:
      type: None
  - kind: method
    name: recall_selected_variation
    raw_doc: Recalls the currently selected macro variation.Does nothing if there are no variations.
    signature: 'recall_selected_variation( (Device)arg1) -> None :'
    cpp_signature: void recall_selected_variation(TPyHandle<ADevice>)
    returns:
      type: None
  - kind: method
    name: remove_macro
    raw_doc: Decreases the number of visible macro controls in the rack. Throws an exception if the minimum number of macro controls is reached.
    signature: 'remove_macro( (RackDevice)arg1) -> None :'
    cpp_signature: void remove_macro(TRackDevicePyHandle)
    returns:
      type: None
  - kind: property
    name: return_chains
    raw_doc: Return const access to the list of return chains in this device. Throws an exception if can_have_chains is false.
    type: Vector
    repr: <class 'Base.Vector'>
    element_repr: <class 'Chain'>
    settable: false
    listenable:
    - add_return_chains_listener
    - remove_return_chains_listener
    - return_chains_has_listener
  - kind: property
    name: selected_variation_index
    raw_doc: Access to the index of the currently selected macro variation.Throws an exception if the index is out of range.
    type: int
    settable: true
  - kind: method
    name: store_variation
    raw_doc: Stores a new variation of the values of all currently mapped macros
    signature: 'store_variation( (Device)arg1) -> None :'
    cpp_signature: void store_variation(TPyHandle<ADevice>)
    returns:
      type: None
  - kind: property
    name: type
    raw_doc: Return the type of the device.
    type: DeviceType
    repr: <class 'Device.DeviceType'>
    settable: false
  - kind: property
    name: variation_count
    raw_doc: Access to the number of macro variations currently stored.
    type: int
    settable: false
    listenable:
    - add_variation_count_listener
    - remove_variation_count_listener
    - variation_count_has_listener
  - kind: property
    name: view
    raw_doc: Representing the view aspects of a device.
    type: View
    repr: <class 'RackDevice.View'>
    settable: false
  - kind: property
    name: visible_drum_pads
    raw_doc: Return const access to the list of visible drum pads in this device. Throws an exception if can_have_drum_pads is false.
    type: Vector
    repr: <class 'Base.Vector'>
    element_repr: <class 'DrumPad.DrumPad'>
    settable: false
    listenable:
    - add_visible_drum_pads_listener
    - remove_visible_drum_pads_listener
    - visible_drum_pads_has_listener
  - kind: property
    name: visible_macro_count
    raw_doc: Access to the number of macros that are currently visible.
    type: int
    settable: false
    listenable:
    - add_visible_macro_count_listener
    - remove_visible_macro_count_listener
    - visible_macro_count_has_listener
