module: Eq8Device
primary_class:
- name: Eq8Device
  raw_doc: This class represents an Eq8 device.
  ancestors:
  - Device
  - LomObject
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  constructable: false
  properties:
  - name: can_compare_ab
    raw_doc: Returns true if the Device has the capability to AB compare.
    settable: false
  - name: can_have_chains
    raw_doc: Returns true if the device is a rack.
    settable: false
  - name: can_have_drum_pads
    raw_doc: Returns true if the device is a drum rack.
    settable: false
  - name: canonical_parent
    raw_doc: Get the canonical parent of the Device.
    settable: false
  - name: class_display_name
    raw_doc: Return const access to the name of the device's class name as displayed in Live's browser and device chain
    settable: false
  - name: class_name
    raw_doc: Return const access to the name of the device's class.
    settable: false
  - name: edit_mode
    raw_doc: Access to Eq8's edit mode.
    settable: true
    listenable:
    - add_edit_mode_listener
    - remove_edit_mode_listener
    - edit_mode_has_listener
  - name: global_mode
    raw_doc: Access to Eq8's global mode.
    settable: true
    listenable:
    - add_global_mode_listener
    - remove_global_mode_listener
    - global_mode_has_listener
  - name: is_active
    raw_doc: Return const access to whether this device is active. This will be false bothwhen the device is off and when it's inside a rack device which is off.
    settable: false
  - name: is_using_compare_preset_b
    raw_doc: Returns whether the Device has loaded the preset in compare slot B. Only relevant if can_compare_ab, otherwise errors.
    settable: true
  - name: latency_in_ms
    raw_doc: Returns the latency of the device in ms.
    settable: false
  - name: latency_in_samples
    raw_doc: Returns the latency of the device in samples.
    settable: false
  - name: name
    raw_doc: Return access to the name of the device.
    settable: true
  - name: oversample
    raw_doc: Access to Eq8's oversample value.
    settable: true
    listenable:
    - add_oversample_listener
    - remove_oversample_listener
    - oversample_has_listener
  - name: parameters
    raw_doc: Const access to the list of available automatable parameters for this device.
    settable: false
  - name: type
    raw_doc: Return the type of the device.
    settable: false
  - name: view
    raw_doc: Representing the view aspects of a device.
    settable: false
  classes:
  - name: View
    raw_doc: Representing the view aspects of an Eq8 device.
    ancestors:
    - View
    - LomObject
    init_doc: |-
      Raises an exception
      This class cannot be instantiated from Python
    constructable: false
    properties:
    - name: canonical_parent
      raw_doc: Get the canonical parent of the View.
      settable: false
    - name: is_collapsed
      raw_doc: Get/Set/Listen if the device is shown collapsed in the device chain.
      settable: true
    - name: selected_band
      raw_doc: Access to the selected filter band.
      settable: true
      listenable:
      - add_selected_band_listener
      - remove_selected_band_listener
      - selected_band_has_listener
enums:
- name: EditMode
  members:
    a: 0
    b: 1
- name: GlobalMode
  members:
    stereo: 0
    left_right: 1
    mid_side: 2
