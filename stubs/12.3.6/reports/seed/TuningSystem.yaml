module: TuningSystem
members:
- kind: class
  name: TuningSystem
  raw_doc: Represents a Tuning System and its properties.
  ancestors:
  - LomObject
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  members:
  - kind: property
    name: canonical_parent
    raw_doc: Get the canonical parent of the TuningSystem.
    type: Song
    repr: <class 'Song.Song'>
    settable: false
  - kind: property
    name: highest_note
    raw_doc: |-
      Get/Set the highest note of the current tuning system, where the first entry is
      the index within the pseudo octave and the second entry is the octave.
    type: PitchClassAndOctave
    repr: <class 'TuningSystem.PitchClassAndOctave'>
    settable: true
    listenable:
    - add_highest_note_listener
    - remove_highest_note_listener
    - highest_note_has_listener
  - kind: property
    name: lowest_note
    raw_doc: |-
      Get/Set the lowest note of the current tuning system, where the first entry is
      the index within the pseudo octave and the second entry is the octave.
    type: PitchClassAndOctave
    repr: <class 'TuningSystem.PitchClassAndOctave'>
    settable: true
    listenable:
    - add_lowest_note_listener
    - remove_lowest_note_listener
    - lowest_note_has_listener
  - kind: property
    name: name
    raw_doc: Get/Set the name of the currently active tuning system.
    type: str
    settable: true
    listenable:
    - add_name_listener
    - remove_name_listener
    - name_has_listener
  - kind: property
    name: note_tunings
    raw_doc: Get/Set the currently active tuning system's note tunings, specified in Cents, where 100 Cents is one semi-tone in equal temperament.
    type: list
    repr: <class 'list'>
    element_repr: <class 'float'>
    settable: true
    listenable:
    - add_note_tunings_listener
    - remove_note_tunings_listener
    - note_tunings_has_listener
  - kind: property
    name: number_of_notes_in_pseudo_octave
    raw_doc: Get the number of notes in the pseudo octave.
    type: int
    settable: false
  - kind: property
    name: pseudo_octave_in_cents
    raw_doc: Get the pseudo octave in cents for the currently active tuning system.
    type: float
    settable: false
  - kind: property
    name: reference_pitch
    raw_doc: Get/Set the reference pitch the currently active tuning system.
    type: ReferencePitch
    repr: <class 'TuningSystem.ReferencePitch'>
    settable: true
    listenable:
    - add_reference_pitch_listener
    - remove_reference_pitch_listener
    - reference_pitch_has_listener
- kind: class
  name: PitchClassAndOctave
  raw_doc: This class represents a PitchClassAndOctave type.
  ancestors: []
  init_doc: |-
    __init__( (object)arg1, (int)index_in_octave, (int)octave) -> None :
        Create a new pitch class and octave specification.

        C++ signature :
            void __init__(_object*,int,int)
  constructable: true
  members:
  - kind: property
    name: index_in_octave
    raw_doc: A PitchClassAndOctave's index within the pseudo octave.
    type: int
    settable: false
  - kind: property
    name: octave
    raw_doc: A PitchClassAndOctave's octave.
    type: int
    settable: false
- kind: class
  name: ReferencePitch
  raw_doc: This class represents a ReferencePitch type.
  ancestors: []
  init_doc: |-
    __init__( (object)arg1, (int)index_in_octave, (int)octave, (float)frequency) -> None :
        Create a new reference pitch specification.

        C++ signature :
            void __init__(_object*,int,int,double)
  constructable: true
  members:
  - kind: property
    name: frequency
    raw_doc: A ReferencePitch's frequency in Hz.
    type: float
    settable: false
  - kind: property
    name: index_in_octave
    raw_doc: A ReferencePitch's index within the pseudo octave.
    type: int
    settable: false
  - kind: property
    name: octave
    raw_doc: A ReferencePitch's octave.
    type: int
    settable: false
