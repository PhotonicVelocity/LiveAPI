module: LooperDevice
members:
- kind: class
  name: LooperDevice
  raw_doc: This class represents a Looper device.
  ancestors:
  - Device
  - LomObject
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  members:
  - kind: property
    name: can_compare_ab
    raw_doc: Returns true if the Device has the capability to AB compare.
    type: bool
    settable: false
  - kind: property
    name: can_have_chains
    raw_doc: Returns true if the device is a rack.
    type: bool
    settable: false
  - kind: property
    name: can_have_drum_pads
    raw_doc: Returns true if the device is a drum rack.
    type: bool
    settable: false
  - kind: property
    name: canonical_parent
    raw_doc: Get the canonical parent of the Device.
    type: Track
    repr: <class 'Track.Track'>
    settable: false
  - kind: property
    name: class_display_name
    raw_doc: Return const access to the name of the device's class name as displayed in Live's browser and device chain
    type: str
    settable: false
  - kind: property
    name: class_name
    raw_doc: Return const access to the name of the device's class.
    type: str
    settable: false
  - kind: method
    name: clear
    raw_doc: Erase Looper's recorded content.
    signature: 'clear( (LooperDevice)arg1) -> None :'
    cpp_signature: void clear(TLooperDevicePyHandle)
    returns:
      type: None
  - kind: method
    name: double_length
    raw_doc: Double the length of Looper's buffer.
    signature: 'double_length( (LooperDevice)arg1) -> None :'
    cpp_signature: void double_length(TLooperDevicePyHandle)
    returns:
      type: None
  - kind: method
    name: double_speed
    raw_doc: Double the speed of Looper's playback.
    signature: 'double_speed( (LooperDevice)arg1) -> None :'
    cpp_signature: void double_speed(TLooperDevicePyHandle)
    returns:
      type: None
  - kind: method
    name: export_to_clip_slot
    raw_doc: Export Looper's content to a Session Clip Slot.
    signature: 'export_to_clip_slot( (LooperDevice)arg1, (ClipSlot)arg2) -> None :'
    cpp_signature: void export_to_clip_slot(TLooperDevicePyHandle,TPyHandle<AGroupAndClipSlotBase>)
    args:
    - name: clip_slot
      type: ClipSlot
    returns:
      type: None
  - kind: method
    name: half_length
    raw_doc: Halve the length of Looper's buffer.
    signature: 'half_length( (LooperDevice)arg1) -> None :'
    cpp_signature: void half_length(TLooperDevicePyHandle)
    returns:
      type: None
  - kind: method
    name: half_speed
    raw_doc: Halve the speed of Looper's playback.
    signature: 'half_speed( (LooperDevice)arg1) -> None :'
    cpp_signature: void half_speed(TLooperDevicePyHandle)
    returns:
      type: None
  - kind: property
    name: is_active
    raw_doc: Return const access to whether this device is active. This will be false bothwhen the device is off and when it's inside a rack device which is off.
    type: bool
    settable: false
  - kind: property
    name: is_using_compare_preset_b
    raw_doc: Returns whether the Device has loaded the preset in compare slot B. Only relevant if can_compare_ab, otherwise errors.
    type: bool
    settable: true
  - kind: property
    name: latency_in_ms
    raw_doc: Returns the latency of the device in ms.
    type: float
    settable: false
  - kind: property
    name: latency_in_samples
    raw_doc: Returns the latency of the device in samples.
    type: int
    settable: false
  - kind: property
    name: loop_length
    raw_doc: The length of Looper's buffer.
    type: float
    settable: false
    listenable:
    - add_loop_length_listener
    - remove_loop_length_listener
    - loop_length_has_listener
  - kind: property
    name: name
    raw_doc: Return access to the name of the device.
    type: str
    settable: true
  - kind: method
    name: overdub
    raw_doc: Play back while adding additional layers of incoming audio.
    signature: 'overdub( (LooperDevice)arg1) -> None :'
    cpp_signature: void overdub(TLooperDevicePyHandle)
    returns:
      type: None
  - kind: property
    name: overdub_after_record
    raw_doc: If true, Looper will switch to overdub after recording, when recording a fixed number of bars. Otherwise, the switch will be to playback without overdubbing.
    type: bool
    settable: true
    listenable:
    - add_overdub_after_record_listener
    - remove_overdub_after_record_listener
    - overdub_after_record_has_listener
  - kind: property
    name: parameters
    raw_doc: Const access to the list of available automatable parameters for this device.
    type: ATimeableValueVector
    repr: <class 'Device.ATimeableValueVector'>
    element_repr: <class 'DeviceParameter.DeviceParameter'>
    settable: false
  - kind: method
    name: play
    raw_doc: Play back without overdubbing.
    signature: 'play( (LooperDevice)arg1) -> None :'
    cpp_signature: void play(TLooperDevicePyHandle)
    returns:
      type: None
  - kind: method
    name: record
    raw_doc: Record incoming audio.
    signature: 'record( (LooperDevice)arg1) -> None :'
    cpp_signature: void record(TLooperDevicePyHandle)
    returns:
      type: None
  - kind: property
    name: record_length_index
    raw_doc: Access to the Record Length chooser entry index.
    type: int
    settable: true
    listenable:
    - add_record_length_index_listener
    - remove_record_length_index_listener
    - record_length_index_has_listener
  - kind: property
    name: record_length_list
    raw_doc: Read-only access to the list of Record Length chooser entry strings.
    type: StringVector
    repr: <class 'Base.StringVector'>
    element_repr: <class 'str'>
    settable: false
  - kind: method
    name: stop
    raw_doc: Stop Looper's playback.
    signature: 'stop( (LooperDevice)arg1) -> None :'
    cpp_signature: void stop(TLooperDevicePyHandle)
    returns:
      type: None
  - kind: property
    name: tempo
    raw_doc: The tempo of Looper's buffer.
    type: float
    settable: false
    listenable:
    - add_tempo_listener
    - remove_tempo_listener
    - tempo_has_listener
  - kind: property
    name: type
    raw_doc: Return the type of the device.
    type: DeviceType
    repr: <class 'Device.DeviceType'>
    settable: false
  - kind: method
    name: undo
    raw_doc: Erase everything that was recorded since the last time Overdub was enabled. Calling a second time will restore the material erased by the previous undooperation.
    signature: 'undo( (LooperDevice)arg1) -> None :'
    cpp_signature: void undo(TLooperDevicePyHandle)
    returns:
      type: None
  - kind: property
    name: view
    raw_doc: Representing the view aspects of a device.
    type: View
    repr: <class 'Device.View'>
    settable: false
