module: MixerDevice
members:
- kind: class
  name: MixerDevice
  raw_doc: |-
    This class represents a Mixer Device in Live, which gives you
    access to the Volume and Panning properties of a Track.
  ancestors:
  - LomObject
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  members:
  - kind: property
    name: canonical_parent
    raw_doc: Get the canonical parent of the mixer device.
    type: Track
    repr: <class 'Track.Track'>
    settable: false
  - kind: property
    name: crossfade_assign
    raw_doc: 'Player- and ReturnTracks only: Access to the Track''s Crossfade Assign State.'
    type: int
    settable: true
    listenable:
    - add_crossfade_assign_listener
    - remove_crossfade_assign_listener
    - crossfade_assign_has_listener
  - kind: enum
    name: crossfade_assignments
    members:
      A: 0
      NONE: 1
      B: 2
  - kind: property
    name: crossfader
    raw_doc: 'MainTrack only: Const access to the Crossfader.'
    type: DeviceParameter
    repr: <class 'DeviceParameter.DeviceParameter'>
    settable: false
  - kind: property
    name: cue_volume
    raw_doc: 'MainTrack only: Const access to the Cue Volume Parameter.'
    type: DeviceParameter
    repr: <class 'DeviceParameter.DeviceParameter'>
    settable: false
  - kind: property
    name: left_split_stereo
    raw_doc: Const access to the Track's Left Split Stereo Panning Device Parameter.
    type: DeviceParameter
    repr: <class 'DeviceParameter.DeviceParameter'>
    settable: false
  - kind: property
    name: panning
    raw_doc: Const access to the Tracks Panning Device Parameter.
    type: DeviceParameter
    repr: <class 'DeviceParameter.DeviceParameter'>
    settable: false
  - kind: property
    name: panning_mode
    raw_doc: Access to the Track's Panning Mode.
    type: int
    settable: true
    listenable:
    - add_panning_mode_listener
    - remove_panning_mode_listener
    - panning_mode_has_listener
  - kind: enum
    name: panning_modes
    members:
      stereo: 0
      stereo_split: 1
  - kind: property
    name: right_split_stereo
    raw_doc: Const access to the Track's Right Split Stereo Panning Device Parameter.
    type: DeviceParameter
    repr: <class 'DeviceParameter.DeviceParameter'>
    settable: false
  - kind: property
    name: sends
    raw_doc: Const access to the Tracks list of Send Amount Device Parameters.
    type: Vector
    repr: <class 'Base.Vector'>
    element_repr: <class 'DeviceParameter.DeviceParameter'>
    settable: false
    listenable:
    - add_sends_listener
    - remove_sends_listener
    - sends_has_listener
  - kind: property
    name: song_tempo
    raw_doc: 'MainTrack only: Const access to the Song''s Tempo.'
    type: DeviceParameter
    repr: <class 'DeviceParameter.DeviceParameter'>
    settable: false
  - kind: property
    name: track_activator
    raw_doc: Const access to the Tracks Activator Device Parameter.
    type: DeviceParameter
    repr: <class 'DeviceParameter.DeviceParameter'>
    settable: false
  - kind: property
    name: volume
    raw_doc: Const access to the Tracks Volume Device Parameter.
    type: DeviceParameter
    repr: <class 'DeviceParameter.DeviceParameter'>
    settable: false
