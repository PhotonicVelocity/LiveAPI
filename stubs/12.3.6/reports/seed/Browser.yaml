module: Browser
primary_class:
- name: Browser
  path: Live.Browser.Browser
  raw_doc: This class represents the live browser data base.
  ancestors:
  - Live.LomObject.LomObject
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  constructable: false
