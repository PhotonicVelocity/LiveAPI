module: GroovePool
primary_class:
- name: GroovePool
  path: Live.GroovePool.GroovePool
  raw_doc: This class represents the groove pool in Live.
  ancestors:
  - Live.LomObject.LomObject
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  constructable: false
  properties:
  - name: _live_ptr
    type: int
    settable: false
  - name: canonical_parent
    raw_doc: Get the canonical parent of the groove pool.
    type: Live.Song.Song
    settable: false
  - name: grooves
    raw_doc: Access to the list of grooves
    type: Live.Base.Vector
    element_type: Live.Groove.Groove
    settable: false
    listenable:
    - add_grooves_listener
    - remove_grooves_listener
    - grooves_has_listener
