module: Track
primary_class:
- name: Track
  path: Live.Track.Track
  raw_doc: |-
    This class represents a track in Live. It can be either an Audio
    track, a MIDI Track, a Return Track or the Main track. The Main
    Track and at least one Audio or MIDI track will be always present.
    Return Tracks are optional.
  ancestors:
  - Live.Track.DeviceContainer
  - Live.LomObject.LomObject
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  constructable: false
  properties:
  - name: _live_ptr
    type: int
    settable: false
  - name: arm
    raw_doc: Arm the track for recording. Not available for Main- and Send Tracks.
    type: bool
    settable: true
    listenable:
    - add_arm_listener
    - remove_arm_listener
    - arm_has_listener
  - name: arrangement_clips
    raw_doc: const access to the list of clips in arrangement viewThe list will be empty for the main, send and group tracks.
    type: Live.Base.Vector[Live.Clip.Clip]
    settable: false
    listenable:
    - add_arrangement_clips_listener
    - remove_arrangement_clips_listener
    - arrangement_clips_has_listener
  - name: available_input_routing_channels
    raw_doc: Return a list of source channels for input routing.
    type: Live.Track.RoutingChannelVector
    settable: false
    listenable:
    - add_available_input_routing_channels_listener
    - remove_available_input_routing_channels_listener
    - available_input_routing_channels_has_listener
  - name: available_input_routing_types
    raw_doc: Return a list of source types for input routing.
    type: Live.Track.RoutingTypeVector
    settable: false
    listenable:
    - add_available_input_routing_types_listener
    - remove_available_input_routing_types_listener
    - available_input_routing_types_has_listener
  - name: available_output_routing_channels
    raw_doc: Return a list of destination channels for output routing.
    type: Live.Track.RoutingChannelVector
    settable: false
    listenable:
    - add_available_output_routing_channels_listener
    - remove_available_output_routing_channels_listener
    - available_output_routing_channels_has_listener
  - name: available_output_routing_types
    raw_doc: Return a list of destination types for output routing.
    type: Live.Track.RoutingTypeVector
    settable: false
    listenable:
    - add_available_output_routing_types_listener
    - remove_available_output_routing_types_listener
    - available_output_routing_types_has_listener
  - name: back_to_arranger
    raw_doc: Indicates if it's possible to go back to playing back the clips in the Arranger.Setting a value 0 will go back to the Arranger playback. Setting on grouptracks will go back to the Arranger on all grouped tracks.
    type: bool
    settable: true
    listenable:
    - add_back_to_arranger_listener
    - remove_back_to_arranger_listener
    - back_to_arranger_has_listener
  - name: can_be_armed
    raw_doc: |-
      return True, if this Track has a valid arm property. Not all tracks
      can be armed (for example return Tracks or the Main Tracks).
    type: bool
    settable: false
  - name: can_be_frozen
    raw_doc: return True, if this Track can be frozen.
    type: bool
    settable: false
  - name: can_show_chains
    raw_doc: return True, if this Track contains a rack instrument device that is capable of showing its chains in session view.
    type: bool
    settable: false
  - name: canonical_parent
    raw_doc: Get the canonical parent of the track.
    type: Live.Song.Song
    settable: false
  - name: clip_slots
    raw_doc: |-
      const access to the list of clipslots (see class AClipSlot) for this track.
      The list will be empty for the main and sendtracks.
    type: Live.Base.Vector[Live.ClipSlot.ClipSlot]
    settable: false
    listenable:
    - add_clip_slots_listener
    - remove_clip_slots_listener
    - clip_slots_has_listener
  - name: color
    raw_doc: Get/set access to the color of the Track (RGB).
    type: int
    settable: true
    listenable:
    - add_color_listener
    - remove_color_listener
    - color_has_listener
  - name: color_index
    raw_doc: Get/Set access to the color index of the track. Can be None for no color.
    type: int
    settable: true
    listenable:
    - add_color_index_listener
    - remove_color_index_listener
    - color_index_has_listener
  - name: current_input_routing
    raw_doc: |-
      Get/Set the name of the current active input routing.
      When setting a new routing, the new routing must be one of the available ones.
    type: str
    settable: true
    listenable:
    - add_current_input_routing_listener
    - remove_current_input_routing_listener
    - current_input_routing_has_listener
  - name: current_input_sub_routing
    raw_doc: |-
      Get/Set the current active input sub routing.
      When setting a new routing, the new routing must be one of the available ones.
    type: str
    settable: true
    listenable:
    - add_current_input_sub_routing_listener
    - remove_current_input_sub_routing_listener
    - current_input_sub_routing_has_listener
  - name: current_monitoring_state
    raw_doc: Get/Set the track's current monitoring state.
    type: int
    settable: true
    listenable:
    - add_current_monitoring_state_listener
    - remove_current_monitoring_state_listener
    - current_monitoring_state_has_listener
  - name: current_output_routing
    raw_doc: |-
      Get/Set the current active output routing.
      When setting a new routing, the new routing must be one of the available ones.
    type: str
    settable: true
    listenable:
    - add_current_output_routing_listener
    - remove_current_output_routing_listener
    - current_output_routing_has_listener
  - name: current_output_sub_routing
    raw_doc: |-
      Get/Set the current active output sub routing.
      When setting a new routing, the new routing must be one of the available ones.
    type: str
    settable: true
    listenable:
    - add_current_output_sub_routing_listener
    - remove_current_output_sub_routing_listener
    - current_output_sub_routing_has_listener
  - name: devices
    raw_doc: |-
      Return const access to all available Devices that are present in the Tracks
      Devicechain. This tuple will also include the 'mixer_device' that every Track
      always has.
    type: Live.Base.Vector[Live.Device.Device]
    settable: false
    listenable:
    - add_devices_listener
    - remove_devices_listener
    - devices_has_listener
  - name: fired_slot_index
    raw_doc: |-
      const access to the index of the fired (and thus blinking) clipslot in this track.
      This index is -1 if no slot is fired and -2 if the track's stop button has been fired.
    type: int
    settable: false
    listenable:
    - add_fired_slot_index_listener
    - remove_fired_slot_index_listener
    - fired_slot_index_has_listener
  - name: fold_state
    raw_doc: Get/Set whether the track is folded or not. Only available if is_foldable is True.
    type: bool
    settable: true
  - name: group_track
    raw_doc: return the group track if is_grouped.
    type: Live.Track.Track
    settable: false
  - name: has_audio_input
    raw_doc: |-
      return True, if this Track can be feed with an Audio signal. This is
      true for all Audio Tracks.
    type: bool
    settable: false
    listenable:
    - add_has_audio_input_listener
    - remove_has_audio_input_listener
    - has_audio_input_has_listener
  - name: has_audio_output
    raw_doc: |-
      return True, if this Track sends out an Audio signal. This is
      true for all Audio Tracks, and MIDI tracks with an Instrument.
    type: bool
    settable: false
    listenable:
    - add_has_audio_output_listener
    - remove_has_audio_output_listener
    - has_audio_output_has_listener
  - name: has_midi_input
    raw_doc: |-
      return True, if this Track can be feed with an Audio signal. This is
      true for all MIDI Tracks.
    type: bool
    settable: false
    listenable:
    - add_has_midi_input_listener
    - remove_has_midi_input_listener
    - has_midi_input_has_listener
  - name: has_midi_output
    raw_doc: |-
      return True, if this Track sends out MIDI events. This is
      true for all MIDI Tracks with no Instruments.
    type: bool
    settable: false
    listenable:
    - add_has_midi_output_listener
    - remove_has_midi_output_listener
    - has_midi_output_has_listener
  - name: implicit_arm
    raw_doc: Arm the track for recording. When The track is implicitly armed, it showsin a weaker color in the live GUI and is not saved in the set.
    type: bool
    settable: true
    listenable:
    - add_implicit_arm_listener
    - remove_implicit_arm_listener
    - implicit_arm_has_listener
  - name: input_meter_left
    raw_doc: Momentary value of left input channel meter, 0.0 to 1.0. For Audio Tracks only.
    type: float
    settable: false
    listenable:
    - add_input_meter_left_listener
    - remove_input_meter_left_listener
    - input_meter_left_has_listener
  - name: input_meter_level
    raw_doc: |-
      Return the MIDI or Audio meter value of the Tracks input, depending on the
      type of the Track input. Meter values (MIDI or Audio) are always scaled
      from 0.0 to 1.0.
    type: float
    settable: false
    listenable:
    - add_input_meter_level_listener
    - remove_input_meter_level_listener
    - input_meter_level_has_listener
  - name: input_meter_right
    raw_doc: Momentary value of right input channel meter, 0.0 to 1.0. For Audio Tracks only.
    type: float
    settable: false
    listenable:
    - add_input_meter_right_listener
    - remove_input_meter_right_listener
    - input_meter_right_has_listener
  - name: input_routing_channel
    raw_doc: |-
      Get and set the current source channel for input routing.
      Raises ValueError if the type isn't one of the current values in
      available_input_routing_channels.
    type: Live.Track.RoutingChannel
    settable: true
    listenable:
    - add_input_routing_channel_listener
    - remove_input_routing_channel_listener
    - input_routing_channel_has_listener
  - name: input_routing_type
    raw_doc: |-
      Get and set the current source type for input routing.
      Raises ValueError if the type isn't one of the current values in
      available_input_routing_types.
    type: Live.Track.RoutingType
    settable: true
    listenable:
    - add_input_routing_type_listener
    - remove_input_routing_type_listener
    - input_routing_type_has_listener
  - name: input_routings
    raw_doc: Const access to the list of available input routings.
    type: Live.Base.StringVector
    settable: false
    listenable:
    - add_input_routings_listener
    - remove_input_routings_listener
    - input_routings_has_listener
  - name: input_sub_routings
    raw_doc: Return a list of all available input sub routings.
    type: Live.Base.StringVector
    settable: false
    listenable:
    - add_input_sub_routings_listener
    - remove_input_sub_routings_listener
    - input_sub_routings_has_listener
  - name: is_foldable
    raw_doc: return True if the track can be (un)folded to hide/reveal contained tracks.
    type: bool
    settable: false
  - name: is_frozen
    raw_doc: return True if this Track is currently frozen. No changes should be applied to the track's devices or clips while it is frozen.
    type: bool
    settable: false
    listenable:
    - add_is_frozen_listener
    - remove_is_frozen_listener
    - is_frozen_has_listener
  - name: is_grouped
    raw_doc: return True if this Track is current part of a group track.
    type: bool
    settable: false
  - name: is_part_of_selection
    raw_doc: return False if the track is not selected.
    type: bool
    settable: false
  - name: is_showing_chains
    raw_doc: Get/Set whether a track with a rack device is showing its chains in session view.
    type: bool
    settable: true
    listenable:
    - add_is_showing_chains_listener
    - remove_is_showing_chains_listener
    - is_showing_chains_has_listener
  - name: is_visible
    raw_doc: return False if the track is hidden within a folded group track.
    type: bool
    settable: false
  - name: mixer_device
    raw_doc: |-
      Return access to the special Device that every Track has: This Device contains
      the Volume, Pan, Sendamounts, and Crossfade assignment parameters.
    type: Live.MixerDevice.MixerDevice
    settable: false
  - name: mute
    raw_doc: Mute/unmute the track.
    type: bool
    settable: true
    listenable:
    - add_mute_listener
    - remove_mute_listener
    - mute_has_listener
  - name: muted_via_solo
    raw_doc: Returns true if the track is muted because another track is soloed.
    type: bool
    settable: false
    listenable:
    - add_muted_via_solo_listener
    - remove_muted_via_solo_listener
    - muted_via_solo_has_listener
  - name: name
    raw_doc: Read/write access to the name of the Track, as visible in the track header.
    type: str
    settable: true
    listenable:
    - add_name_listener
    - remove_name_listener
    - name_has_listener
  - name: output_meter_left
    raw_doc: |-
      Momentary value of left output channel meter, 0.0 to 1.0.
      For tracks with audio output only.
    type: float
    settable: false
    listenable:
    - add_output_meter_left_listener
    - remove_output_meter_left_listener
    - output_meter_left_has_listener
  - name: output_meter_level
    raw_doc: |-
      Return the MIDI or Audio meter value of the Track output (behind the
      mixer_device), depending on the type of the Track input, this can be a MIDI
      or Audio meter. Meter values (MIDI or Audio) are always scaled from 0.0 to 1.0.
    type: float
    settable: false
    listenable:
    - add_output_meter_level_listener
    - remove_output_meter_level_listener
    - output_meter_level_has_listener
  - name: output_meter_right
    raw_doc: |-
      Momentary value of right output channel meter, 0.0 to 1.0.
      For tracks with audio output only.
    type: float
    settable: false
    listenable:
    - add_output_meter_right_listener
    - remove_output_meter_right_listener
    - output_meter_right_has_listener
  - name: output_routing_channel
    raw_doc: |-
      Get and set the current destination channel for output routing.
      Raises ValueError if the channel isn't one of the current values in
      available_output_routing_channels.
    type: Live.Track.RoutingChannel
    settable: true
    listenable:
    - add_output_routing_channel_listener
    - remove_output_routing_channel_listener
    - output_routing_channel_has_listener
  - name: output_routing_type
    raw_doc: |-
      Get and set the current destination type for output routing.
      Raises ValueError if the type isn't one of the current values in
      available_output_routing_types.
    type: Live.Track.RoutingType
    settable: true
    listenable:
    - add_output_routing_type_listener
    - remove_output_routing_type_listener
    - output_routing_type_has_listener
  - name: output_routings
    raw_doc: Const access to the list of all available output routings.
    type: Live.Base.StringVector
    settable: false
    listenable:
    - add_output_routings_listener
    - remove_output_routings_listener
    - output_routings_has_listener
  - name: output_sub_routings
    raw_doc: Return a list of all available output sub routings.
    type: Live.Base.StringVector
    settable: false
    listenable:
    - add_output_sub_routings_listener
    - remove_output_sub_routings_listener
    - output_sub_routings_has_listener
  - name: performance_impact
    raw_doc: Reports the performance impact of this track.
    type: float
    settable: false
    listenable:
    - add_performance_impact_listener
    - remove_performance_impact_listener
    - performance_impact_has_listener
  - name: playing_slot_index
    raw_doc: |-
      const access to the index of the currently playing clip in the track.
      Will be -1 when no clip is playing.
    type: int
    settable: false
    listenable:
    - add_playing_slot_index_listener
    - remove_playing_slot_index_listener
    - playing_slot_index_has_listener
  - name: solo
    raw_doc: |-
      Get/Set the solo status of the track. Note that this will not disable the
      solo state of any other track. If you want exclusive solo, you have to
      disable the solo state of the other Tracks manually.
    type: bool
    settable: true
    listenable:
    - add_solo_listener
    - remove_solo_listener
    - solo_has_listener
  - name: take_lanes
    raw_doc: returns the take lanes.
    type: Live.Base.Vector[Live.TakeLane.TakeLane]
    settable: false
    listenable:
    - add_take_lanes_listener
    - remove_take_lanes_listener
    - take_lanes_has_listener
  - name: view
    raw_doc: Representing the view aspects of a Track.
    type: Live.Track.Track.View
    settable: false
  - name: data
    listenable:
    - add_data_listener
    - remove_data_listener
    - data_has_listener
  methods:
  - name: create_audio_clip
    raw_doc: |-
      Creates an audio clip referencing the file at the given path and inserts it into the arrangement at the specified time.
      Throws an error when called on a non-audio or a frozen track, when the specified time is outside the [0., 1576800.] range, when the track is currently being recorded into, or when the path doesn't point to a valid audio file.
    signature: 'create_audio_clip( (Track)arg1, (object)arg2, (float)arg3) -> Clip :'
    cpp_signature: TWeakPtr<TPyHandle<AClip>> create_audio_clip(TTrackPyHandle,TString,double)
    args:
    - name: self
      type: Live.Track.Track
    - name: arg2
      type: str
    - name: arg3
      type: float
    returns:
      type: Live.Clip.Clip
  - name: create_midi_clip
    raw_doc: |-
      Creates an empty MIDI clip and inserts it into the arrangement at the specified time.
      Throws an error when called on a non-MIDI track or a frozen track, when the specified time is outside the [0., 1576800.] range, or when the track is currently being recorded into.
    signature: 'create_midi_clip( (Track)arg1, (float)arg2, (float)arg3) -> Clip :'
    cpp_signature: TWeakPtr<TPyHandle<AClip>> create_midi_clip(TTrackPyHandle,double,double)
    args:
    - name: self
      type: Live.Track.Track
    - name: arg2
      type: float
    - name: arg3
      type: float
    returns:
      type: Live.Clip.Clip
  - name: create_take_lane
    raw_doc: Create a new TakeLane for this track.
    signature: 'create_take_lane( (Track)arg1) -> LomObject :'
    cpp_signature: TWeakPtr<TPyHandleBase> create_take_lane(TTrackPyHandle)
    args:
    - name: self
      type: Live.Track.Track
    returns:
      type: Live.LomObject.LomObject
  - name: delete_clip
    raw_doc: Delete the given clip. Raises a runtime error when the clip belongs to another track.
    signature: 'delete_clip( (Track)arg1, (Clip)arg2) -> None :'
    cpp_signature: void delete_clip(TTrackPyHandle,TPyHandle<AClip>)
    args:
    - name: self
      type: Live.Track.Track
    - name: arg2
      type: Live.Clip.Clip
    returns:
      type: None
  - name: delete_device
    raw_doc: Delete a device identified by the index in the 'devices' list.
    signature: 'delete_device( (Track)arg1, (int)arg2) -> None :'
    cpp_signature: void delete_device(TTrackPyHandle,int)
    args:
    - name: self
      type: Live.Track.Track
    - name: arg2
      type: int
    returns:
      type: None
  - name: duplicate_clip_slot
    raw_doc: |-
      Duplicate a clip and put it into the next free slot and return the index
      of the destination slot. A new scene is created if no free slot is
      available. If creating the new scene would exceed the limitations,
      a runtime error is raised.
    signature: 'duplicate_clip_slot( (Track)arg1, (int)arg2) -> int :'
    cpp_signature: int duplicate_clip_slot(TTrackPyHandle,int)
    args:
    - name: self
      type: Live.Track.Track
    - name: arg2
      type: int
    returns:
      type: int
  - name: duplicate_clip_to_arrangement
    raw_doc: |-
      Duplicate the given clip into the arrangement of this track at the provided
      destination time and return it. When the type of the clip and the type of the
      track are incompatible, a runtime error is raised.
    signature: 'duplicate_clip_to_arrangement( (Track)self, (Clip)clip, (float)destination_time) -> Clip :'
    cpp_signature: TWeakPtr<TPyHandle<AClip>> duplicate_clip_to_arrangement(TTrackPyHandle,TPyHandle<AClip>,double)
    args:
    - name: self
      type: Live.Track.Track
    - name: clip
      type: Live.Clip.Clip
    - name: destination_time
      type: float
    returns:
      type: Live.Clip.Clip
  - name: duplicate_device
    raw_doc: Duplicate a device at a given index in the 'devices' list.
    signature: 'duplicate_device( (Track)arg1, (int)arg2) -> None :'
    cpp_signature: void duplicate_device(TTrackPyHandle,int)
    args:
    - name: self
      type: Live.Track.Track
    - name: arg2
      type: int
    returns:
      type: None
  - name: get_data
    raw_doc: Get data for the given key, that was previously stored using set_data.
    signature: 'get_data( (Track)arg1, (object)key, (object)default_value) -> object :'
    cpp_signature: boost::python::api::object get_data(TTrackPyHandle,TString,boost::python::api::object)
    args:
    - name: self
      type: Live.Track.Track
    - name: key
      type: str
    - name: default_value
      type: object
    returns:
      type: object
  - name: insert_device
    raw_doc: Add a device at a given index in the 'devices' list. At end if -1.
    signature: 'insert_device( (Track)arg1, (str)DeviceName [, (int)DeviceIndex=-1]) -> LomObject :'
    cpp_signature: TWeakPtr<TPyHandleBase> insert_device(TTrackPyHandle,std::__1::basic_string<char, std::__1::char_traits<char>, std::__1::allocator<char>> [,int=-1])
    args:
    - name: self
      type: Live.Track.Track
    - name: device_name
      type: str
    - name: device_index
      type: int
      optional: true
      default: '-1'
    returns:
      type: Live.LomObject.LomObject
  - name: jump_in_running_session_clip
    raw_doc: |-
      Jump forward or backward in the currently running Sessionclip (if any)
      by the specified relative amount in beats. Does nothing if no Session Clip
      is currently running.
    signature: 'jump_in_running_session_clip( (Track)arg1, (float)arg2) -> None :'
    cpp_signature: void jump_in_running_session_clip(TTrackPyHandle,double)
    args:
    - name: self
      type: Live.Track.Track
    - name: arg2
      type: float
    returns:
      type: None
  - name: set_data
    raw_doc: Store data for the given key in this object. The data is persistent and will be restored when loading the Live Set.
    signature: 'set_data( (Track)arg1, (object)key, (object)value) -> None :'
    cpp_signature: void set_data(TTrackPyHandle,TString,boost::python::api::object)
    args:
    - name: self
      type: Live.Track.Track
    - name: key
      type: str
    - name: value
      type: object
    returns:
      type: None
  - name: stop_all_clips
    raw_doc: Stop running and triggered clip and slots on this track.
    signature: 'stop_all_clips( (Track)arg1 [, (bool)Quantized=True]) -> None :'
    cpp_signature: void stop_all_clips(TTrackPyHandle [,bool=True])
    args:
    - name: self
      type: Live.Track.Track
    - name: quantized
      type: bool
      optional: true
      default: 'True'
    returns:
      type: None
  classes:
  - name: View
    path: Live.Track.Track.View
    raw_doc: Representing the view aspects of a Track.
    ancestors:
    - Live.LomObject.LomObject
    init_doc: |-
      Raises an exception
      This class cannot be instantiated from Python
    constructable: false
    properties:
    - name: _live_ptr
      type: int
      settable: false
    - name: canonical_parent
      raw_doc: Get the canonical parent of the track view.
      type: Live.Track.Track
      settable: false
    - name: device_insert_mode
      raw_doc: Get/Listen the device insertion mode of the track.  By default, it will insert devices at the end, but it can be changed to make it relative to current selection.
      type: bool
      settable: true
      listenable:
      - add_device_insert_mode_listener
      - remove_device_insert_mode_listener
      - device_insert_mode_has_listener
    - name: is_collapsed
      raw_doc: Get/Set/Listen if the track is shown collapsed in the arranger view.
      type: bool
      settable: true
      listenable:
