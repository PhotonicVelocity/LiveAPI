module: MaxDevice
primary_class:
- name: MaxDevice
  raw_doc: This class represents a Max for Live device.
  ancestors:
  - Device
  - LomObject
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  constructable: false
  properties:
  - name: audio_inputs
    raw_doc: Const access to a list of all audio inputs of the device.
    settable: false
    listenable:
    - add_audio_inputs_listener
    - remove_audio_inputs_listener
    - audio_inputs_has_listener
  - name: audio_outputs
    raw_doc: Const access to a list of all audio outputs of the device.
    settable: false
    listenable:
    - add_audio_outputs_listener
    - remove_audio_outputs_listener
    - audio_outputs_has_listener
  - name: can_compare_ab
    raw_doc: Returns true if the Device has the capability to AB compare.
    settable: false
  - name: can_have_chains
    raw_doc: Returns true if the device is a rack.
    settable: false
  - name: can_have_drum_pads
    raw_doc: Returns true if the device is a drum rack.
    settable: false
  - name: canonical_parent
    raw_doc: Get the canonical parent of the Device.
    settable: false
  - name: class_display_name
    raw_doc: Return const access to the name of the device's class name as displayed in Live's browser and device chain
    settable: false
  - name: class_name
    raw_doc: Return const access to the name of the device's class.
    settable: false
  - name: is_active
    raw_doc: Return const access to whether this device is active. This will be false bothwhen the device is off and when it's inside a rack device which is off.
    settable: false
  - name: is_using_compare_preset_b
    raw_doc: Returns whether the Device has loaded the preset in compare slot B. Only relevant if can_compare_ab, otherwise errors.
    settable: true
  - name: latency_in_ms
    raw_doc: Returns the latency of the device in ms.
    settable: false
  - name: latency_in_samples
    raw_doc: Returns the latency of the device in samples.
    settable: false
  - name: midi_inputs
    raw_doc: Const access to a list of all midi outputs of the device.
    settable: false
    listenable:
    - add_midi_inputs_listener
    - remove_midi_inputs_listener
    - midi_inputs_has_listener
  - name: midi_outputs
    raw_doc: Const access to a list of all midi outputs of the device.
    settable: false
    listenable:
    - add_midi_outputs_listener
    - remove_midi_outputs_listener
    - midi_outputs_has_listener
  - name: name
    raw_doc: Return access to the name of the device.
    settable: true
  - name: parameters
    raw_doc: Const access to the list of available automatable parameters for this device.
    settable: false
  - name: type
    raw_doc: Return the type of the device.
    settable: false
  - name: view
    raw_doc: Representing the view aspects of a device.
    settable: false
  - name: bank_parameters_changed
    listenable:
    - add_bank_parameters_changed_listener
    - remove_bank_parameters_changed_listener
    - bank_parameters_changed_has_listener
  methods:
  - name: get_bank_count
    raw_doc: Get the number of parameter banks. This is related to hardware control surfaces.
    signature: 'get_bank_count( (MaxDevice)arg1) -> int :'
    cpp_signature: int get_bank_count(TMaxDevicePyHandle)
    args:
    - name: self
      type: MaxDevice
    returns:
      type: int
  - name: get_bank_name
    raw_doc: Get the name of a parameter bank given by index. This is related to hardware control surfaces.
    signature: 'get_bank_name( (MaxDevice)arg1, (int)arg2) -> str :'
    cpp_signature: TString get_bank_name(TMaxDevicePyHandle,int)
    args:
    - name: self
      type: MaxDevice
    - name: arg2
      type: int
    returns:
      type: str
  - name: get_bank_parameters
    raw_doc: Get the indices of parameters of the given bank index. Empty slots are marked as -1. Bank index -1 refers to the best-of bank. This function is related to hardware control surfaces.
    signature: 'get_bank_parameters( (MaxDevice)arg1, (int)arg2) -> list :'
    cpp_signature: boost::python::list get_bank_parameters(TMaxDevicePyHandle,int)
    args:
    - name: self
      type: MaxDevice
    - name: arg2
      type: int
    returns:
      type: list
  - name: get_value_item_icons
    raw_doc: Get a list of icon identifier strings for a list parameter's values.An empty string is given where no icon should be displayed.An empty list is given when no icons should be displayed.This is related to hardware control surfaces.
    signature: 'get_value_item_icons( (MaxDevice)arg1, (DeviceParameter)arg2) -> list :'
    cpp_signature: boost::python::list get_value_item_icons(TMaxDevicePyHandle,TPyHandle<ATimeableValue>)
    args:
    - name: self
      type: MaxDevice
    - name: arg2
      type: DeviceParameter
    returns:
      type: list
