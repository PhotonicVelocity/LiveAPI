module: LomObject
description: |
  Defines the structural base class shared by every object reachable through
  Live's Object Model. The `LomObject` class supplies the common identity and
  observation machinery that every concrete LOM type (Song, Track, Clip,
  Device, ...) inherits.

primary_class:
- name: LomObject
  path: Live.LomObject.LomObject
  raw_doc: this is the base class for an object that is accessible via the LOM
  ancestors: []
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  constructable: false

  properties:
  - name: _live_ptr
    type: int
    settable: false
