module: LomObject
_note: |
  Module-level prose (intro, lifetime/identity model, collections) and
  the "Live Object Model" page title now live in
  `stubs/12.3.6/foundation/lom-object.md`. That foundation page pulls
  this module's structural content (`Live.LomObject.LomObject` class +
  `_live_ptr` / `canonical_parent` properties) in via its
  `include_module: LomObject` frontmatter directive.

primary_class:
- name: LomObject
  path: Live.LomObject.LomObject
  raw_doc: this is the base class for an object that is accessible via the LOM
  ancestors:
  - Boost.Python.instance
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  constructable: false

  properties:
  - name: _live_ptr
    type: int
    settable: false

  # Synthesized — not declared on `Live.LomObject.LomObject` in Live's
  # runtime. Each top-level LOM-tree node (Track, Scene, Clip, Device,
  # Application, Song, ...) redeclares `canonical_parent` independently
  # with a class-specific narrower return type (covariant override),
  # presumably so the runtime can avoid a generic `LomObject | None`.
  # Hoisted here in the YAML so the LomObject page reflects the
  # conceptual model — every LOM-tree node exposes it. Per-class
  # declarations on subclasses still take precedence in the rendered
  # output (Track shows `canonical_parent: Song`, not the generic).
  - name: canonical_parent
    raw_doc: Get the canonical parent — the structural owner one step up the LOM tree.
    type: Live.LomObject.LomObject | None
    settable: false
    _synthesized: true
    _synthesis_note: |
      Conceptually universal across LOM-tree nodes but not declared
      on `LomObject` itself in Live's runtime. Application and Song
      probe as the only LOM nodes whose `canonical_parent` returns
      None (they sit at the root). All other concrete LOM classes
      return a concrete parent type.
