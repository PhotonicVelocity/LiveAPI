module: RoarDevice
description: |
  Represents an instance of Roar, Live's multi-stage saturation and
  distortion effect. The `RoarDevice` class extends `Device` with the
  routing-mode and stage-arrangement state unique to Roar.

primary_class:
- name: RoarDevice
  path: Live.RoarDevice.RoarDevice
  raw_doc: This class represents a Roar device.
  ancestors:
  - Live.Device.Device
  - Live.LomObject.LomObject
  - Boost.Python.instance
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  constructable: false

  properties:
  - name: env_listen
    raw_doc: Return the Envelope Input Listen toggle state
    type: bool
    settable: true
    listenable:
    - add_env_listen_listener
    - remove_env_listen_listener
    - env_listen_has_listener

  - name: is_active
    raw_doc: Return const access to whether this device is active. This will be false bothwhen the device is off and when it's inside a rack device which is off.
    type: bool
    settable: false

  - name: is_using_compare_preset_b
    raw_doc: Returns whether the Device has loaded the preset in compare slot B. Only relevant if can_compare_ab, otherwise errors.
    type: bool
    settable: true

  - name: latency_in_ms
    raw_doc: Returns the latency of the device in ms.
    type: float
    settable: false

  - name: latency_in_samples
    raw_doc: Returns the latency of the device in samples.
    type: int
    settable: false

  - name: name
    raw_doc: Return access to the name of the device.
    type: str
    settable: true

  - name: parameters
    raw_doc: Const access to the list of available automatable parameters for this device.
    type: Live.Device.ATimeableValueVector
    settable: false

  - name: routing_mode_index
    raw_doc: Return the routing mode index
    type: int
    settable: true
    listenable:
    - add_routing_mode_index_listener
    - remove_routing_mode_index_listener
    - routing_mode_index_has_listener

  - name: routing_mode_list
    raw_doc: Return the routing mode list
    type: Live.Base.StringVector
    settable: false
