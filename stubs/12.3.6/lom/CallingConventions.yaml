module: CallingConventions
title: Calling conventions
sidebar_hidden: true
_note: |
  Special-cased in the rendered reference site: hoisted above the
  alphabetical Modules group as a first-class sidebar entry (see
  `web/astro.config.mjs`), and the `Parameters` section label on
