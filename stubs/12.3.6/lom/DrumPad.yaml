module: DrumPad

primary_class:
- name: DrumPad
  path: Live.DrumPad.DrumPad
  raw_doc: This class represents a drum group device pad in Live.
  ancestors:
  - Live.LomObject.LomObject
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  constructable: false

  properties:
  - name: _live_ptr
    type: int
    settable: false

  - name: canonical_parent
    raw_doc: Get the canonical parent of the drum pad.
    type: Live.RackDevice.RackDevice
    settable: false

  - name: chains
    raw_doc: Return const access to the list of chains in this drum pad.
    type: Live.Base.Vector
    element_type_override:
      value: Live.Chain.Chain
      confidence: high
      source: |
        raw_doc: "Return const access to the list of chains in this drum pad."
        M4L docs (drumpad.md): `chains [Chain] read-only observe`. Corpus
        pushbase/device_chain_utils.py:14 reads `drum_pad.chains[0].devices`.
    settable: false
    listenable:
    - add_chains_listener
    - remove_chains_listener
    - chains_has_listener

  - name: mute
    raw_doc: Mute/unmute the pad.
    type: bool
    settable: true
    listenable:
    - add_mute_listener
    - remove_mute_listener
    - mute_has_listener

  - name: name
    raw_doc: Return const access to the drum pad's name. It depends on the contained chains.
    type: str
    settable: false
    listenable:
    - add_name_listener
    - remove_name_listener
    - name_has_listener

  - name: note
    raw_doc: Get the MIDI note of the drum pad.
    type: int
    settable: false

  - name: solo
    raw_doc: Solo/unsolo the pad.
    type: bool
    settable: true
    listenable:
    - add_solo_listener
    - remove_solo_listener
    - solo_has_listener

  methods:
  - name: delete_all_chains
    raw_doc: Deletes all chains associated with a drum pad. This is equivalent to deleting a drum rack pad in Live.
    signature: 'delete_all_chains( (DrumPad)arg1) -> None :'
    cpp_signature: void delete_all_chains(TPyHandle<ADrumGroupDevicePad>)
    args:
    - name: self
      type: Live.DrumPad.DrumPad
    returns:
      type: None
