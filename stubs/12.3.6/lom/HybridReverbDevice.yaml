module: HybridReverbDevice
description: |
  Represents an instance of Hybrid Reverb, Live's convolution-and-algorithm
  reverb. The `HybridReverbDevice` class extends `Device` with the impulse-
  response selection and reverb-mode state unique to the device.

primary_class:
- name: HybridReverbDevice
  path: Live.HybridReverbDevice.HybridReverbDevice
  raw_doc: This class represents a Hybrid Reverb device.
  ancestors:
  - Live.Device.Device
  - Live.LomObject.LomObject
  - Boost.Python.instance
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  constructable: false

  properties:
  - name: ir_attack_time
    raw_doc: Return the current IrAttackTime
    type: float
    settable: true
    listenable:
    - add_ir_attack_time_listener
    - remove_ir_attack_time_listener
    - ir_attack_time_has_listener

  - name: ir_category_index
    raw_doc: Return the current IR category index
    type: int
    settable: true
    listenable:
    - add_ir_category_index_listener
    - remove_ir_category_index_listener
    - ir_category_index_has_listener

  - name: ir_category_list
    raw_doc: Return the current IR categories list
    type: Live.Base.StringVector
    settable: false

  - name: ir_decay_time
    raw_doc: Return the current IrDecayTime
    type: float
    settable: true
    listenable:
    - add_ir_decay_time_listener
    - remove_ir_decay_time_listener
    - ir_decay_time_has_listener

  - name: ir_file_index
    raw_doc: Return the current IR file index
    type: int
    settable: true
    listenable:
    - add_ir_file_index_listener
    - remove_ir_file_index_listener
    - ir_file_index_has_listener

  - name: ir_file_list
    raw_doc: Return the current IR file list
    type: Live.Base.StringVector
    settable: false
    listenable:
    - add_ir_file_list_listener
    - remove_ir_file_list_listener
    - ir_file_list_has_listener

  - name: ir_size_factor
    raw_doc: Return the current IrSizeFactor
    type: float
    settable: true
    listenable:
    - add_ir_size_factor_listener
    - remove_ir_size_factor_listener
    - ir_size_factor_has_listener

  - name: ir_time_shaping_on
    raw_doc: Return the current IrTimeShapingOn
    type: bool
    settable: true
    listenable:
    - add_ir_time_shaping_on_listener
    - remove_ir_time_shaping_on_listener
    - ir_time_shaping_on_has_listener

  - name: is_active
    raw_doc: Return const access to whether this device is active. This will be false bothwhen the device is off and when it's inside a rack device which is off.
    type: bool
    settable: false

  - name: is_using_compare_preset_b
    raw_doc: Returns whether the Device has loaded the preset in compare slot B. Only relevant if can_compare_ab, otherwise errors.
    type: bool
    settable: true

  - name: latency_in_ms
    raw_doc: Returns the latency of the device in ms.
    type: float
    settable: false

  - name: latency_in_samples
    raw_doc: Returns the latency of the device in samples.
    type: int
    settable: false

  - name: name
    raw_doc: Return access to the name of the device.
    type: str
    settable: true

  - name: parameters
    raw_doc: Const access to the list of available automatable parameters for this device.
    type: Live.Device.ATimeableValueVector
    settable: false
