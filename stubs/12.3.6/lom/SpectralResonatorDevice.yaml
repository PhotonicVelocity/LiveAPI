module: SpectralResonatorDevice
description: |
  Represents an instance of Spectral Resonator, Live's pitched spectral
  effect. The `SpectralResonatorDevice` class extends `Device` with the
  MIDI-driven and external-sidechain mode state unique to the resonator.

primary_class:
- name: SpectralResonatorDevice
  path: Live.SpectralResonatorDevice.SpectralResonatorDevice
  raw_doc: This class represents a Spectral Resonator device.
  ancestors:
  - Live.Device.Device
  - Live.LomObject.LomObject
  - Boost.Python.instance
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  constructable: false

  properties:
  - name: frequency_dial_mode
    raw_doc: Return the current frequency dial mode index
    type: int
    settable: true
    listenable:
    - add_frequency_dial_mode_listener
    - remove_frequency_dial_mode_listener
    - frequency_dial_mode_has_listener

  - name: frequency_dial_mode_list
    raw_doc: Return the current frequency dial mode list
    type: Live.Base.StringVector
    settable: false
    listenable:
    - add_frequency_dial_mode_list_listener
    - remove_frequency_dial_mode_list_listener
    - frequency_dial_mode_list_has_listener

  - name: is_active
    raw_doc: Return const access to whether this device is active. This will be false bothwhen the device is off and when it's inside a rack device which is off.
    type: bool
    settable: false

  - name: is_using_compare_preset_b
    raw_doc: Returns whether the Device has loaded the preset in compare slot B. Only relevant if can_compare_ab, otherwise errors.
    type: bool
    settable: true

  - name: latency_in_ms
    raw_doc: Returns the latency of the device in ms.
    type: float
    settable: false

  - name: latency_in_samples
    raw_doc: Returns the latency of the device in samples.
    type: int
    settable: false

  - name: midi_gate
    raw_doc: Return the current midi gate index
    type: int
    settable: true
    listenable:
    - add_midi_gate_listener
    - remove_midi_gate_listener
    - midi_gate_has_listener

  - name: midi_gate_list
    raw_doc: Return the current midi gate list
    type: Live.Base.StringVector
    settable: false
    listenable:
    - add_midi_gate_list_listener
    - remove_midi_gate_list_listener
    - midi_gate_list_has_listener

  - name: mod_mode
    raw_doc: Return the current mod mode index
    type: int
    settable: true
    listenable:
    - add_mod_mode_listener
    - remove_mod_mode_listener
    - mod_mode_has_listener

  - name: mod_mode_list
    raw_doc: Return the current mod mode list
    type: Live.Base.StringVector
    settable: false
    listenable:
    - add_mod_mode_list_listener
    - remove_mod_mode_list_listener
    - mod_mode_list_has_listener

  - name: mono_poly
    raw_doc: Return the current mono poly mode index
    type: int
    settable: true
    listenable:
    - add_mono_poly_listener
    - remove_mono_poly_listener
    - mono_poly_has_listener

  - name: mono_poly_list
    raw_doc: Return the current mono poly mode list
    type: Live.Base.StringVector
    settable: false
    listenable:
    - add_mono_poly_list_listener
    - remove_mono_poly_list_listener
    - mono_poly_list_has_listener

  - name: name
    raw_doc: Return access to the name of the device.
    type: str
    settable: true

  - name: parameters
    raw_doc: Const access to the list of available automatable parameters for this device.
    type: Live.Device.ATimeableValueVector
    settable: false

  - name: pitch_bend_range
    raw_doc: Return the current pitch bend range
    type: int
    settable: true
    listenable:
    - add_pitch_bend_range_listener
    - remove_pitch_bend_range_listener
    - pitch_bend_range_has_listener

  - name: pitch_mode
    raw_doc: Return the current pitch mode index
    type: int
    settable: true
    listenable:
    - add_pitch_mode_listener
    - remove_pitch_mode_listener
    - pitch_mode_has_listener

  - name: pitch_mode_list
    raw_doc: Return the current pitch mode list
    type: Live.Base.StringVector
    settable: false
    listenable:
    - add_pitch_mode_list_listener
    - remove_pitch_mode_list_listener
    - pitch_mode_list_has_listener

  - name: polyphony
    raw_doc: Return the current polyphony
    type: int
    settable: true
    listenable:
    - add_polyphony_listener
    - remove_polyphony_listener
    - polyphony_has_listener
