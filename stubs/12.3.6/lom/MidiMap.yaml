  raw_doc: Structure to define feedback properties of MIDI mappings.
  ancestors:
  - Boost.Python.instance
  init_doc: |-
    __init__( (object)arg1) -> None :

        C++ signature :
            void __init__(_object*)
  constructable: true

  properties:
  - name: cc_no
    type: int
    settable: true

  - name: cc_value_map
    type: tuple
    element_type_override:
      value: int
      confidence: high
      source: |
        [corpus] int tuples assigned directly:
        LV2_LX2_LC2_LD2/ParamMap.py:69, SL_MkIII/sl_mkiii.py:117,
        _Axiom/Encoders.py:38.
    settable: true

  - name: channel
    type: int
    settable: true

  - name: delay_in_ms
    type: float
    settable: true

  - name: enabled
    type: bool
    settable: true

  methods:
