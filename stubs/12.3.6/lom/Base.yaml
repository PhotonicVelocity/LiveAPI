  init_doc: |-
    __init__( (object)arg1, (object)callback, (int)interval [, (bool)repeat=False [, (bool)start=False]]) -> None :

        C++ signature :
            void __init__(_object*,boost::python::api::object,int [,bool=False [,bool=False]])
  constructable: true

  properties:
