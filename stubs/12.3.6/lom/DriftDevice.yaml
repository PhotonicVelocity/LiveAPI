module: DriftDevice
description: |
  Represents an instance of Drift, Live's monosynth instrument. The
  `DriftDevice` class extends `Device` with Drift-specific state alongside
  the inherited parameter and preset surface.

primary_class:
- name: DriftDevice
  path: Live.DriftDevice.DriftDevice
  raw_doc: This class represents a Drift device.
  ancestors:
  - Live.Device.Device
  - Live.LomObject.LomObject
  - Boost.Python.instance
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  constructable: false

  properties:
  - name: is_active
    raw_doc: Return const access to whether this device is active. This will be false bothwhen the device is off and when it's inside a rack device which is off.
    type: bool
    settable: false

  - name: is_using_compare_preset_b
    raw_doc: Returns whether the Device has loaded the preset in compare slot B. Only relevant if can_compare_ab, otherwise errors.
    type: bool
    settable: true

  - name: latency_in_ms
    raw_doc: Returns the latency of the device in ms.
    type: float
    settable: false

  - name: latency_in_samples
    raw_doc: Returns the latency of the device in samples.
    type: int
    settable: false

  - name: mod_matrix_filter_source_1_index
    raw_doc: Return the filter mod source 1 index
    type: int
    settable: true
    listenable:
    - add_mod_matrix_filter_source_1_index_listener
    - remove_mod_matrix_filter_source_1_index_listener
    - mod_matrix_filter_source_1_index_has_listener

  - name: mod_matrix_filter_source_1_list
    raw_doc: Return the filter mod source 1 list
    type: Live.Base.StringVector
    settable: false

  - name: mod_matrix_filter_source_2_index
    raw_doc: Return the filter mod source 2 index
    type: int
    settable: true
    listenable:
