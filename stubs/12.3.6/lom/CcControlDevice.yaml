module: CcControlDevice
description: |
  Represents a CC Control device — Live's MIDI utility that maps an incoming
  MIDI control to a chosen target. The `CcControlDevice` class extends
  `Device` with the custom-target selectors and lists that drive its mapping
  UI.

primary_class:
- name: CcControlDevice
  path: Live.CcControlDevice.CcControlDevice
  raw_doc: This class represents a CcControl device.
  ancestors:
  - Live.Device.Device
  - Live.LomObject.LomObject
  - Boost.Python.instance
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  constructable: false

