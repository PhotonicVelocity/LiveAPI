module: Device
description: |
  Represents a MIDI or audio device on a track or in a rack chain. The `Device`
  class is the base for every Live and third-party device — its automatable
  parameters, on/off state, and preset-loading behavior are shared by all
  device subclasses.

primary_class:
- name: Device
  path: Live.Device.Device
  raw_doc: This class represents a MIDI or Audio DSP-Device in Live.
  ancestors:
  - Live.LomObject.LomObject
  - Boost.Python.instance
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  constructable: false

  properties:
  - name: can_compare_ab
    raw_doc: Returns true if the Device has the capability to AB compare.
    type: bool
    settable: false

  - name: can_have_chains
    raw_doc: Returns true if the device is a rack.
    type: bool
    settable: false

  - name: can_have_drum_pads
    raw_doc: Returns true if the device is a drum rack.
    type: bool
    settable: false

  - name: canonical_parent
    raw_doc: Get the canonical parent of the Device.
    type: Live.Track.Track
    settable: false

  - name: class_display_name
    raw_doc: Return const access to the name of the device's class name as displayed in Live's browser and device chain
    type: str
    settable: false

  - name: class_name
    raw_doc: Return const access to the name of the device's class.
    type: str
    settable: false

  - name: is_active
    raw_doc: Return const access to whether this device is active. This will be false bothwhen the device is off and when it's inside a rack device which is off.
    type: bool
    settable: false
    listenable:
    - add_is_active_listener
    - remove_is_active_listener
    - is_active_has_listener

  - name: is_using_compare_preset_b
    raw_doc: Returns whether the Device has loaded the preset in compare slot B. Only relevant if can_compare_ab, otherwise errors.
    type: bool
    settable: true
    listenable:
    - add_is_using_compare_preset_b_listener
    - remove_is_using_compare_preset_b_listener
    - is_using_compare_preset_b_has_listener

  - name: latency_in_ms
    raw_doc: Returns the latency of the device in ms.
    type: float
    settable: false
    listenable:
    - add_latency_in_ms_listener
    - remove_latency_in_ms_listener
    - latency_in_ms_has_listener

  - name: latency_in_samples
    raw_doc: Returns the latency of the device in samples.
    type: int
    settable: false
    listenable:
    - add_latency_in_samples_listener
    - remove_latency_in_samples_listener
    - latency_in_samples_has_listener

  - name: name
    raw_doc: Return access to the name of the device.
    type: str
    settable: true
    listenable:
    - add_name_listener
    - remove_name_listener
    - name_has_listener

  - name: parameters
    raw_doc: Const access to the list of available automatable parameters for this device.
    type: Live.Device.ATimeableValueVector
    settable: false
    listenable:
    - add_parameters_listener
    - remove_parameters_listener
    - parameters_has_listener

  - name: type
    raw_doc: Return the type of the device.
    type: Live.Device.DeviceType
    settable: false

  - name: view
    raw_doc: Representing the view aspects of a device.
    type: Live.Device.Device.View
    settable: false

  methods:
  - name: save_preset_to_compare_ab_slot
    raw_doc: Saves the current state of the device to the compare AB slot. Only relevant if can_compare_ab, otherwise throws.
    signature: 'save_preset_to_compare_ab_slot( (Device)arg1) -> None :'
    cpp_signature: void save_preset_to_compare_ab_slot(TPyHandle<ADevice>)
    args:
    - name: self
      type: Live.Device.Device
    returns:
      type: None

  - name: store_chosen_bank
    raw_doc: Set the selected bank in the device for persistency.
    signature: 'store_chosen_bank( (Device)arg1, (int)arg2, (int)arg3) -> None :'
    cpp_signature: void store_chosen_bank(TPyHandle<ADevice>,int,int)
    args:
    - name: self
      type: Live.Device.Device
    - name: arg2
      name_override:
        value: script_index
        source: |
          [M4L] external/max-for-live-docs/9.0/device.md names the parameter
          `script_index`.
      type: int
    - name: arg3
      name_override:
        value: bank_index
        source: |
          [M4L] external/max-for-live-docs/9.0/device.md names the parameter
          `bank_index`.
      type: int
    returns:
      type: None

  classes:
  - name: View
    path: Live.Device.Device.View
    raw_doc: Representing the view aspects of a device.
    ancestors:
    - Live.LomObject.LomObject
    - Boost.Python.instance
    init_doc: |-
      Raises an exception
      This class cannot be instantiated from Python
    constructable: false

    properties:
    - name: canonical_parent
      raw_doc: Get the canonical parent of the View.
      type: Live.Device.Device
      settable: false

    - name: is_collapsed
      raw_doc: Get/Set/Listen if the device is shown collapsed in the device chain.
      type: bool
      settable: true
      listenable:
      - add_is_collapsed_listener
      - remove_is_collapsed_listener
      - is_collapsed_has_listener

classes:
- name: ATimeableValueVector
  path: Live.Device.ATimeableValueVector
  ancestors: []
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  constructable: false
  iterable: true
  element_type: Live.DeviceParameter.DeviceParameter
  container: true

enums:
- name: DeviceType
  raw_doc: The type of the device.
  members:
    undefined: 0
    instrument: 1
    audio_effect: 2
    midi_effect: 4
