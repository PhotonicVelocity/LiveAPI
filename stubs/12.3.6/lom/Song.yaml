module: Song
description: |
  Represents the current Live Set — the root of the open document, reached
  via `Application.get_document()` from the running app. The `Song` class
  exposes transport state, session and arrangement editing, undo history,
  and the `Song.View` used to drive Live's UI selection.

primary_class:
- name: Song
  path: Live.Song.Song
  raw_doc: This class represents a Live set.
  ancestors:
  - Live.LomObject.LomObject
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  constructable: false

  properties:
  - name: appointed_device
    raw_doc: Read, write, and listen access to the appointed Device
    type: None
    type_override:
      value: Live.Device.Device | None
      confidence: high
      source: |
        Docstring: "Read, write, and listen access to the appointed Device." Corpus-
        verified — pushbase / ableton.v2 / ableton.v3 all read and assign Device
        values here.
    settable: true
    listenable:
    - add_appointed_device_listener
    - remove_appointed_device_listener
    - appointed_device_has_listener

