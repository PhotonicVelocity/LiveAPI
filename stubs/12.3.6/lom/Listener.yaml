module: Listener
_note: |
  Module-level prose (subscription model, lifetime, threading, listener-only
  triplets) and the "Listeners" page title now live in
  `stubs/12.3.6/foundation/listeners.md`. That foundation page pulls this
  module's structural content (`ListenerHandle` + `ListenerVector`) in via
  its `include_module: Listener` frontmatter directive.

classes:
- name: ListenerHandle
  path: Live.Listener.ListenerHandle
  raw_doc: This class represents a Python listener when connected to a Live property.
  ancestors:
  - Boost.Python.instance
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  constructable: false

  properties:
  - name: listener_func
    raw_doc: Returns the original function
    settable: false
    type_override:
      value: Callable
      confidence: high
      source: '[docstring] "Returns the original function" — functions are Callable.'

  - name: listener_self
    raw_doc: Returns the weak reference to original self, if it was a bound method
    settable: false
    type_override:
      value: Any
      confidence: medium
      source: |
        [docstring] "weak reference to original self, if it was a bound method" —
        can be any object instance (or None for non-bound functions). `Any` is
        appropriately broad but could be `Any | None` if probed.

  - name: name
    raw_doc: Prints the name of the property that this listener is connected to
    settable: false
    type_override:
      value: str
      confidence: medium
      source: |
        [docstring] "Prints the name of the property that this listener is
        connected to" — boost.python doc-style "Prints" implies a printable string
        return on a property access (returns the property name as a string).
        ListenerHandle is internal-only (zero corpus references); raw_doc is the
        strongest evidence available.

  methods:
  - name: disconnect
    raw_doc: Disconnects the listener from its property
    signature: 'disconnect( (ListenerHandle)arg1) -> None :'
    cpp_signature: void disconnect(LPythonRemote {lvalue})
    args:
    - name: self
      type: Live.Listener.ListenerHandle
    returns:
      type: None

- name: ListenerVector
  path: Live.Listener.ListenerVector
  raw_doc: A read only container for accessing a list of listeners.
  ancestors:
  - Boost.Python.instance
  init_doc: |-
    Raises an exception
    This class cannot be instantiated from Python
  constructable: false
  iterable: true
  element_type_override:
    value: Live.Listener.ListenerHandle
    confidence: high
    source: |
      [docstring] "container for accessing a list of listeners" — contains
      ListenerHandle instances.
  container: true
